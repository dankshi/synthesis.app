<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>synthesis.app</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #b0b0b0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  /* Subtle scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.08) 2px,
      rgba(0, 0, 0, 0.08) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* Ambient glow that slowly drifts */
  body::before {
    content: '';
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(68, 170, 153, 0.06) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: glow-drift 8s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes glow-drift {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    33% { transform: translate(-45%, -55%) scale(1.1); opacity: 1; }
    66% { transform: translate(-55%, -45%) scale(0.95); opacity: 0.8; }
  }

  .terminal {
    width: 100%;
    max-width: 540px;
    position: relative;
  }

  .prompt { color: #555; }
  .command { color: #e0e0e0; }
  .highlight { color: #fff; font-weight: 700; }
  .muted { color: #444; }
  .success { color: #4a9; }

  .line {
    line-height: 1.8;
    white-space: pre-wrap;
    opacity: 0;
  }

  .blank { height: 1.8em; opacity: 0; }

  /* Typing cursor for lines being typed */
  .typing-cursor::after {
    content: '\2588';
    color: #4a9;
    animation: cursor-blink 0.6s step-end infinite;
    margin-left: 1px;
  }

  @keyframes cursor-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Form styles */
  form {
    display: flex;
    gap: 0;
    margin-top: 1.8em;
    align-items: center;
    line-height: 1.8;
    opacity: 0;
  }

  label {
    color: #555;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .input-group {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  input {
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    outline: none;
    color: #e0e0e0;
    font-family: inherit;
    font-size: inherit;
    line-height: 1.8;
    flex: 1;
    min-width: 0;
    transition: border-color 0.3s;
  }

  input:focus {
    caret-color: #4a9;
    border-bottom-color: #333;
  }

  input::placeholder { color: #333; }

  button {
    background: transparent;
    border: 1px solid #333;
    color: #666;
    font-family: inherit;
    font-size: 12px;
    padding: 2px 10px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  button::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(68, 170, 153, 0.1);
    transform: translateX(-100%);
    transition: transform 0.3s;
  }

  button:hover {
    border-color: #4a9;
    color: #4a9;
    text-shadow: 0 0 8px rgba(68, 170, 153, 0.5);
  }

  button:hover::before {
    transform: translateX(0);
  }

  .status {
    margin-top: 1.8em;
    line-height: 1.8;
    display: none;
  }

  .status.show {
    display: block;
    animation: glitch-in 0.4s ease-out;
  }

  @keyframes glitch-in {
    0% { opacity: 0; transform: translateX(-4px); filter: blur(2px); }
    30% { opacity: 1; transform: translateX(2px); filter: blur(0); }
    50% { transform: translateX(-1px); }
    100% { transform: translateX(0); }
  }

  /* Flicker on title */
  .highlight {
    animation: text-flicker 4s linear infinite;
  }

  @keyframes text-flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.7; }
    94% { opacity: 1; }
    96% { opacity: 0.8; }
    97% { opacity: 1; }
  }

  @media (max-width: 480px) {
    body { font-size: 13px; }
    .input-group { flex-direction: column; gap: 4px; }
    input { width: 100%; }
  }
</style>
</head>
<body>

<div class="terminal">
  <div class="line" id="line-0"><span class="highlight">synthesis.app</span></div>
  <div class="blank" id="line-1"></div>
  <div class="line" id="line-2"><span class="command">This domain is available.</span></div>
  <div class="blank" id="line-3"></div>
  <div class="line" id="line-4"><span class="muted">Serious inquiries only.</span></div>

  <form id="form" action="https://formsubmit.co/3cbfdf93757b047ee179712db682b899" method="POST">
    <input type="hidden" name="_subject" value="synthesis.app inquiry">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <label>~&gt;&nbsp;</label>
    <div class="input-group">
      <input type="email" name="email" placeholder="email" required autocomplete="off">
      <input type="text" name="offer" placeholder="offer" required autocomplete="off">
      <button type="submit">send</button>
    </div>
  </form>

  <div class="status" id="status">
    <span class="success">sent.</span>
  </div>
</div>

<script>
  // Typewriter effect for text lines
  async function typewrite(el, delay = 35) {
    const span = el.querySelector('span');
    if (!span) { el.style.opacity = '1'; return; }

    const text = span.textContent;
    span.textContent = '';
    el.style.opacity = '1';
    span.classList.add('typing-cursor');

    for (let i = 0; i < text.length; i++) {
      span.textContent += text[i];
      await sleep(delay + Math.random() * 25);
    }
    span.classList.remove('typing-cursor');
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  async function boot() {
    const lines = [
      { id: 'line-0', delay: 40 },
      { id: 'line-1', delay: 0 },
      { id: 'line-2', delay: 30 },
      { id: 'line-3', delay: 0 },
      { id: 'line-4', delay: 25 },
    ];

    await sleep(400);

    for (const line of lines) {
      const el = document.getElementById(line.id);
      if (line.delay === 0) {
        el.style.opacity = '1';
        await sleep(150);
      } else {
        await typewrite(el, line.delay);
        await sleep(300);
      }
    }

    // Fade in the form
    await sleep(200);
    const form = document.getElementById('form');
    form.style.transition = 'opacity 0.5s ease';
    form.style.opacity = '1';
    form.querySelector('input').focus();
  }

  boot();

  // Form submission
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button');
    btn.textContent = '...';

    const data = new FormData(form);
    try {
      await fetch(form.action.replace('formsubmit.co/', 'formsubmit.co/ajax/'), {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });
      form.style.transition = 'opacity 0.3s';
      form.style.opacity = '0';
      setTimeout(() => {
        form.style.display = 'none';
        const status = document.getElementById('status');
        status.classList.add('show');
      }, 300);
    } catch {
      btn.textContent = 'send';
      alert('Error. Try again.');
    }
  });
</script>

</body>
</html>
